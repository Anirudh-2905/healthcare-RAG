[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zs-healthcare-rag"
version = "0.1.0"
description = "A local, evidence-grounded healthcare research assistant with RAG, citations, safety, and evaluation."
requires-python = ">=3.11"
dependencies = [
  "chromadb>=0.5,<2",
  "fastapi>=0.115,<1",
  "pydantic>=2.8,<3",
  "pypdf>=5,<7",
  "requests>=2.32,<3",
  "sentence-transformers>=3,<6",
  "typer>=0.12,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.scripts]
healthcare-rag = "app.cli:app"

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

